<ion-header class="ion-no-border">
  <ion-toolbar color="transparent">
    <ion-buttons slot="start">
      <ion-button fill="clear" color="dark" routerLink="/welcome" routerDirection="back">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-wrapper">

    <div class="main-logo">
      <img src="assets/logo.png" alt="BuyBuy Logo" class="logo-image" />
    </div>

    <div class="titles">
      <h1>{{ strings.t.login.titulo }}</h1>
      <p>{{ strings.t.login.subtitulo }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSessao()" class="form-container">
      
      <div class="custom-input-box">
        <ion-icon name="mail-outline"></ion-icon>
        <ion-input type="email" [placeholder]="strings.t.login.emailPlaceholder" formControlName="email"></ion-input>
      </div>

      <div class="custom-input-box">
        <ion-icon name="lock-closed-outline"></ion-icon>
        
        <ion-input [type]="mostrarSenha ? 'text' : 'password'" [placeholder]="strings.t.login.senhaPlaceholder" formControlName="senha"></ion-input>
        
        <ion-icon 
          [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'" 
          class="suffix-icon" 
          (click)="toggleSenha()"
          style="cursor: pointer;">
        </ion-icon>
      </div>

      <div class="forgot-pwd">
        <a href="#">{{ strings.t.login.esqueceuSenha }}</a>
      </div>

    </form>

    <ion-button class="login-btn" expand="block" (click)="iniciarSessao()">
      {{ strings.t.login.entrar }} <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
    </ion-button>

    <div class="register-link">
      {{ strings.t.login.naoTemConta }} <a routerLink="/registo">{{ strings.t.login.criarConta }}</a>
    </div>

  </div>
</ion-content>
