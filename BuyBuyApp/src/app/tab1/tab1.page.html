<ion-header class="ion-no-border">
  <ion-toolbar color="transparent">
    <!-- Título Principal -->
    <div class="custom-header-title" style="padding: 16px 20px 8px 20px;">
      <h1 style="font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; margin: 0; color: #111111;">As minhas listas</h1>
    </div>

    <!-- Criar Nova Lista (Igual ao de adicionar amigos/grupos na Tab 4) -->
    <ion-buttons slot="end">
      <ion-button routerLink="/nova-lista" style="--background: #f2f2f2; --border-radius: 50%; width: 38px; height: 38px; margin-right: 12px; display: flex; align-items: center; justify-content: center;">
        <ion-icon name="add" style="font-size: 24px; color: #0da33d;"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Barra de Ações (Apenas visível se existir pelo menos uma lista) -->
  <div *ngIf="listasNoEcra && listasNoEcra.length > 0" style="display: flex; align-items: center; margin-bottom: 15px; font-family: 'Outfit', sans-serif; padding-left: 20px;">
    <!-- Selecionar Todas / Desmarcar Todas -->
    <div (click)="toggleSelecionarTodas(); $event.stopPropagation()" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
      <ion-checkbox 
        [checked]="todasSelecionadas"
        style="margin: 0; pointer-events: none; --list-color: #222222;">
      </ion-checkbox>
      <span style="font-size: 14px; font-weight: 600; color: #222222; font-family: 'Outfit', sans-serif; user-select: none;">
        Selecionar tudo
      </span>
    </div>

    <!-- Ações de Arquivar/Excluir (Apenas se houver seleção) com espaçamento aumentado -->
    <div *ngIf="listasSelecionadas.size > 0" style="display: flex; gap: 16px; margin-left: 8px; border-left: 1px solid #ddd; padding-left: 16px; align-items: center;">
      <!-- Arquivar Selecionadas -->
      <ion-button fill="clear" color="dark" size="small" (click)="arquivarSelecionadas()" style="margin: 0; --padding-start: 4px; --padding-end: 4px; height: 32px;" title="Arquivar Selecionadas">
        <ion-icon slot="icon-only" name="archive-outline" style="font-size: 22px; color: #222;"></ion-icon>
      </ion-button>

      <!-- Eliminar Selecionadas -->
      <ion-button fill="clear" color="dark" size="small" (click)="excluirSelecionadas()" style="margin: 0; --padding-start: 4px; --padding-end: 4px; height: 32px;" title="Excluir Selecionadas">
        <ion-icon slot="icon-only" name="trash-outline" style="font-size: 22px; color: #222;"></ion-icon>
      </ion-button>
    </div>
  </div>

  <div class="lists-wrapper">
    
    <div class="list-card" 
         [ngClass]="[lista.cor.startsWith('border-') ? lista.cor : '', listasSelecionadas.has(lista.nome) ? 'selected-card' : '']" 
         [style.border-left-color]="obterCorDeEstilo(lista.cor)"
         [style.background]="listasSelecionadas.has(lista.nome) ? obterFundoSuaveDeEstilo(lista.cor) : '#ffffff'"
         *ngFor="let lista of listasNoEcra" 
         (click)="cliqueNaLista(lista)" 
         style="cursor: pointer;">
         
      <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
        <!-- Checkbox sempre visível com borda preta -->
        <ion-checkbox 
          [checked]="listasSelecionadas.has(lista.nome)"
          (click)="$event.stopPropagation()"
          (ionChange)="toggleSelecaoLista(lista.nome)"
          [style.--list-color]="'#222222'"
          style="margin: 0;">
        </ion-checkbox>

        <div class="list-info" style="flex: 1; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <ion-icon [name]="lista.icone" class="list-icon" style="color: #222222;"></ion-icon>
            <div class="text-group">
              <h3>{{ lista.nome }}</h3>
              <p>{{ lista.dataEdicao }}</p>
            </div>
          </div>
          <div class="item-badge" [style.background-color]="obterCorDeEstilo(lista.cor)">{{ lista.totalItens }} itens</div>
        </div>
      </div>

    </div>

  </div></ion-content>
