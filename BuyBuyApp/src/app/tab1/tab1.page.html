<ion-header class="ion-no-border">
  <ion-toolbar color="transparent">
    <div class="custom-header">
      <div class="user-profile">
        <ion-avatar>
          <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Avatar" />
        </ion-avatar>
        <h2>Olá, João!</h2>
      </div>
      
      <ion-button fill="clear" color="dark">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div class="section-title">
    <h1>As minhas listas</h1>
    <div class="underline"></div>
  </div>

  <div class="lists-wrapper">
    
    <div class="list-card" 
         [ngClass]="lista.cor.startsWith('border-') ? lista.cor : ''" 
         [style.border-left-color]="!lista.cor.startsWith('border-') ? lista.cor : null"
         *ngFor="let lista of listasNoEcra" 
         [routerLink]="['/lista-detalhes', lista.nome]" style="cursor: pointer;">
      <div class="list-info">
        <ion-icon [name]="lista.icone" class="list-icon"></ion-icon>
        <div class="text-group">
          <h3>{{ lista.nome }}</h3>
          <p>{{ lista.dataEdicao }}</p>
        </div>
      </div>
      <div class="item-badge">{{ lista.totalItens }} itens</div>
    </div>

  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button class="custom-fab" routerLink="/nova-lista">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
