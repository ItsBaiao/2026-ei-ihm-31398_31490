<ion-header class="ion-no-border">
  <ion-toolbar color="transparent">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1" text="" icon="arrow-back-outline" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title class="header-title ion-text-center">{{ isEditMode ? 'Editar Lista' : 'Nova Lista' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button color="dark"><ion-icon name="ellipsis-vertical"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding custom-bg">

  <div class="input-card">
    <ion-icon name="pencil-outline"></ion-icon>
    <ion-input type="text" placeholder="Nome da Lista..." [(ngModel)]="nomeDaLista"></ion-input>
  </div>

  <div class="section-block">
    <div class="section-label">ÍCONE DA LISTA</div>
    <div class="horizontal-scroll">
      <div class="icon-circle" [class.active]="iconeEscolhido === 'cart-outline'" (click)="selecionarIcone('cart-outline')"><ion-icon name="cart-outline"></ion-icon></div>
      <div class="icon-circle" [class.active]="iconeEscolhido === 'home-outline'" (click)="selecionarIcone('home-outline')"><ion-icon name="home-outline"></ion-icon></div>
      <div class="icon-circle" [class.active]="iconeEscolhido === 'gift-outline'" (click)="selecionarIcone('gift-outline')"><ion-icon name="gift-outline"></ion-icon></div>
      <div class="icon-circle" [class.active]="iconeEscolhido === 'briefcase-outline'" (click)="selecionarIcone('briefcase-outline')"><ion-icon name="briefcase-outline"></ion-icon></div>
      <div class="icon-circle" [class.active]="iconeEscolhido === 'leaf-outline'" (click)="selecionarIcone('leaf-outline')"><ion-icon name="leaf-outline"></ion-icon></div>
    </div>
  </div>

  <div class="section-block">
    <div class="section-label">COR DA LISTA</div>
    <div class="horizontal-scroll">
      
      <div class="color-circle" [class.active-color]="corEscolhida === 'border-dark'" style="background: #008000;" (click)="selecionarCor('border-dark')">
        <ion-icon name="checkmark" *ngIf="corEscolhida === 'border-dark'"></ion-icon>
      </div>
      <div class="color-circle" [class.active-color]="corEscolhida === 'border-light'" style="background: #3b82f6;" (click)="selecionarCor('border-light')">
        <ion-icon name="checkmark" *ngIf="corEscolhida === 'border-light'"></ion-icon>
      </div>
      <div class="color-circle" [class.active-color]="corEscolhida === 'border-brown'" style="background: #f97316;" (click)="selecionarCor('border-brown')">
        <ion-icon name="checkmark" *ngIf="corEscolhida === 'border-brown'"></ion-icon>
      </div>
      <div class="color-circle" [class.active-color]="corEscolhida === 'border-purple'" style="background: #a855f7;" (click)="selecionarCor('border-purple')">
        <ion-icon name="checkmark" *ngIf="corEscolhida === 'border-purple'"></ion-icon>
      </div>
      <div class="color-circle" [class.active-color]="corEscolhida === 'border-yellow'" style="background: #eab308;" (click)="selecionarCor('border-yellow')">
        <ion-icon name="checkmark" *ngIf="corEscolhida === 'border-yellow'"></ion-icon>
      </div>
      <div class="color-circle" [class.active-color]="corEscolhida === 'border-pink'" style="background: #ec4899;" (click)="selecionarCor('border-pink')">
        <ion-icon name="checkmark" *ngIf="corEscolhida === 'border-pink'"></ion-icon>
      </div>
      
      <div class="icon-circle custom-color-btn" 
           style="background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3); border: none; color: black;" 
           (click)="setModalOpen(true)">
        <ion-icon name="color-wand-outline"></ion-icon>
      </div>

    </div>
  </div>

  <div class="section-block">
    <div class="section-label">LOJA PREFERIDA PARA ESTA LISTA</div>
    <div class="store-card">
      <div class="store-icon"><ion-icon name="location" style="color: white;"></ion-icon></div>
      <div class="store-info">
        <h4 style="font-weight: bold; margin: 0 0 5px; color: #333;">{{ lojaSelecionada?.nome }}</h4>
        <p style="margin: 0; color: #777; font-size: 13px;">{{ lojaSelecionada?.morada }}</p>
      </div>
      <div class="store-action" routerLink="/escolha-loja" style="cursor: pointer; color: #666; font-weight: bold; font-size: 14px;">Alterar</div>
    </div>
    <div class="map-placeholder"></div>
  </div>

  <ion-modal [isOpen]="isColorModalOpen" (didDismiss)="setModalOpen(false)" [initialBreakpoint]="0.85" [breakpoints]="[0, 0.85]">
    <ng-template>
      <div class="modal-header">
        <div class="drag-indicator"></div>
        <div class="modal-title-row">
          <h3>Escolher Cor</h3>
          <ion-icon name="close-outline" (click)="setModalOpen(false)"></ion-icon>
        </div>
      </div>
      
      <div class="modal-content">
        
        <div class="color-spectrum" [style.background]="'hsl(' + hueValue + ', 100%, ' + lightnessValue + '%)'">
          </div>

        <div class="slider hue-slider" style="position: relative;">
          <input type="range" min="0" max="360" [value]="hueValue" (input)="atualizarCorPeloSlider($event)" 
                 style="position: absolute; width: 100%; height: 100%; opacity: 0; z-index: 10; margin: 0; top: 0; left: 0;">
          <div class="slider-thumb" [style.left]="(hueValue / 360 * 100) + '%'"></div>
        </div>

        <div class="slider opacity-slider" style="position: relative; border-radius: 20px;" 
             [style.background]="'linear-gradient(to right, black, hsl(' + hueValue + ', 100%, 50%), white)'">
          <input type="range" min="0" max="100" [value]="lightnessValue" (input)="atualizarLuminosidadePeloSlider($event)" 
                 style="position: absolute; width: 100%; height: 100%; opacity: 0; z-index: 10; margin: 0; top: 0; left: 0;">
          <div class="slider-thumb right" [style.left]="lightnessValue + '%'"></div>
        </div>

        <div class="hex-row">
          <div class="hex-input" style="width: 100%;">
            <ion-input [(ngModel)]="corPersonalizada" style="text-transform: uppercase; font-weight: bold;"></ion-input>
            <span class="copy-text">Copiar</span>
          </div>
        </div>

        <ion-button expand="block" class="confirm-color-btn" (click)="confirmarCorModal()">
          Confirmar Cor
        </ion-button>
      </div>
    </ng-template>
  </ion-modal>

</ion-content>

<ion-footer class="ion-no-border custom-bg">
  <div class="ion-padding">
    <ion-button expand="block" class="create-list-btn" (click)="guardarLista()">
      {{ isEditMode ? 'Guardar Alterações' : 'Criar Lista' }} <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
