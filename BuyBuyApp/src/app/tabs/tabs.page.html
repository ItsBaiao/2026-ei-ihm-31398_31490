<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar">
    
    <!-- 1. Listas -->
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Listas</ion-label>
    </ion-tab-button>

    <!-- 2. Encomendas / Delivery -->
    <ion-tab-button tab="tab5" href="/tabs/tab5">
      <ion-icon name="bicycle-outline"></ion-icon>
      <ion-label>Encomendas</ion-label>
    </ion-tab-button>

    <!-- 3. Produtos (Centro Destacado) -->
    <ion-tab-button tab="tab2" href="/tabs/tab2" class="add-tab-btn">
      <div class="add-rect-box">
        <ion-icon name="search-outline"></ion-icon>
      </div>
      <ion-label>Produtos</ion-label>
    </ion-tab-button>

    <!-- 4. Mensagens -->
    <ion-tab-button tab="tab4" href="/tabs/tab4">
      <div style="position: relative; display: inline-flex; align-items: center; justify-content: center; height: 30px;">
        <ion-icon name="chatbubbles-outline" style="font-size: 24px; margin: 0;"></ion-icon>
        <div *ngIf="unreadChatsCount > 0" style="position: absolute; top: -5px; right: -8px; background: #e53935; color: white; border-radius: 50%; width: 17px; height: 17px; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 1.5px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
          {{ unreadChatsCount }}
        </div>
      </div>
      <ion-label>Mensagens</ion-label>
    </ion-tab-button>

    <!-- 5. Perfil -->
    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
