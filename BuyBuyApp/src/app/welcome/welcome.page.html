<ion-content class="ion-padding ion-text-center">
  <div class="welcome-container">
    
    <div class="header-section">
      <img src="assets/logo.png" alt="BuyBuy Logo" class="welcome-logo" />
      <h1 class="brand-title">BuyBuy</h1>
      <p class="subtitle">Faça as suas compras de forma<br>rápida, fresca e inteligente.</p>
    </div>

    <div class="image-section">
      <img src="assets/welcomeFoto.png" alt="Compras BuyBuy">
    </div>

    <div class="action-section">
      <ion-button expand="block" class="primary-btn" routerLink="/login">
        Iniciar Sessão
      </ion-button>
      
      <ion-button expand="block" fill="outline" class="secondary-btn" routerLink="/registo">
        Criar uma nova conta
      </ion-button>
    </div>

  </div>
</ion-content>
